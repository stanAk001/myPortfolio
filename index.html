<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akeem — Full-stack PERN developer</title>
    <meta name="description" content="Akeem is a full-stack PERN developer in Ibadan, Nigeria. He designs, builds and ships web products: Toolhaven, StockAcademia, KeemStore, Primetime and Hadex." />
    <meta name="theme-color" content="#ece6db" />
    <script>
      // Light by default. Dark only if the visitor switched to it before.
      var dark = false
      try { dark = localStorage.getItem('theme') === 'dark' } catch {}
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111417')
    </script>

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack). __SITE_URL__ is filled in at build time, see vite.config.js. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akeem" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Akeem — Full-stack PERN developer" />
    <meta property="og:description" content="I design, build and ship web products. Five of them are live, see them running." />
